services:
  - type: web
    name: agent-skill-trending-api
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTO_SCHEDULE_ENABLED
        value: "true"
      - key: COLLECTION_INTERVAL_HOURS
        value: "6"
      - key: GITHUB_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
